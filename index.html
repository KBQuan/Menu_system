<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> VegeTingyi 蔬食便當訂購系統</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: 'rgba(253, 247, 243, 0.6)',
              100: 'rgba(245, 232, 219, 0.7)',
              200: 'rgba(229, 196, 170, 0.8)',
              500: '#6f4e37', // 咖啡棕色
              600: '#5a3d28',
              700: '#452d1a',
            },
            fresh: {
              50: 'rgba(253, 247, 243, 0.6)',
              500: '#6f4e37',
              600: '#5a3d28',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 全域字級縮放：控制 html 根字級，Tailwind rem 工具類自動連動 */
    html {
      transition: font-size 0.2s ease;
    }

    /* ── 手機底部 Tab Bar ── */
    .mobile-tab-bar {
      display: none;
    }

    .mobile-tab-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px 4px 10px;
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
      border-radius: 0;
    }

    .mobile-tab-btn.active {
      color: #6f4e37;
    }

    .mobile-tab-btn i {
      font-size: 20px;
      margin-bottom: 1px;
    }

    .mobile-tab-btn .badge {
      position: absolute;
      top: 6px;
      right: calc(50% - 18px);
      background: #6f4e37;
      color: white;
      font-size: 9px;
      font-weight: 900;
      border-radius: 99px;
      padding: 1px 5px;
      min-width: 16px;
      text-align: center;
    }

    @media (max-width: 767px) {
      .mobile-tab-bar {
        display: flex;
        height: 64px;
      }

      /* 在手機模式底部 Tab 佔位，避免內容被遮住並加大空間 */
      body {
        padding-bottom: 84px !important;
        font-size: 16px !important;
      }

      html {
        font-size: 17px !important;
        /* 使根字級變大，讓所有 rem 單位自動等比放大 */
      }

      /* 優化行動裝置輸入框與選單的觸控尺寸與文字大小 */
      input,
      select,
      textarea {
        font-size: 15px !important;
        padding-top: 10px !important;
        padding-bottom: 10px !important;
        min-height: 44px;
        /* 符合行動裝置點擊規範 */
      }

      button {
        font-size: 14px !important;
        min-height: 44px;
      }

      .glass-panel {
        padding: 1.5rem !important;
        /* 加大內距讓內容更好閱讀 */
        border-radius: 20px !important;
      }

      .flex-wrap button {
        font-size: 13px !important;
        padding: 8px 12px !important;
        min-height: auto;
      }

      label {
        font-size: 13.5px !important;
        font-weight: 700 !important;
      }

      h2 {
        font-size: 18px !important;
      }

      p.text-xs {
        font-size: 12.5px !important;
      }

      .mobile-tab-btn span {
        font-size: 12px !important;
      }

      .aside-mobile-hide {
        display: none !important;
      }

      .custom-bento-carousel {
        flex-direction: column;
        overflow-x: hidden;
      }

      .custom-bento-card {
        min-width: 100% !important;
        max-width: 100% !important;
      }

      .custom-bento-card .w-36,
      .custom-bento-card .w-24 {
        width: 100% !important;
        min-width: 0 !important;
      }

      .custom-bento-card .flex.items-center.justify-between {
        flex-wrap: wrap;
        gap: 0.75rem;
      }
    }

    .custom-bento-carousel {
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .custom-bento-card {
      scroll-snap-align: center;
      min-width: min(90vw, 34rem);
      max-width: 34rem;
    }

    .custom-bento-card.active {
      border-color: rgba(16, 185, 129, 0.35);
      box-shadow: 0 25px 45px rgba(16, 185, 129, 0.14);
    }
  </style>
</head>

<body class="text-slate-800 font-sans min-h-screen flex flex-col relative bg-cover bg-center bg-fixed"
  style="background-image: url('background.jpg');" x-data="bentoApp()"
  x-init="init(); $watch('fontSizeLevel', v => { document.documentElement.style.fontSize = v === 0 ? '14px' : v === 2 ? '18px' : '16px'; })">
  <div class="liquid-mesh"></div>

  <div class="fixed top-5 right-5 z-50 flex flex-col gap-3 pointer-events-none">
    <template x-if="toast.show">
      <div x-transition:enter="transition ease-out duration-300 transform translate-y-[-20px] opacity-0"
        x-transition:enter-end="transform translate-y-0 opacity-100"
        x-transition:leave="transition ease-in duration-200 transform translate-y-[-10px] opacity-0"
        class="pointer-events-auto flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-lg border min-w-[320px] max-w-md backdrop-blur-xl bg-white/75"
        :class="{
             'border-green-200 text-green-900 shadow-green-900/5': toast.type === 'success',
             'border-amber-200 text-amber-900 shadow-amber-900/5': toast.type === 'warning',
             'border-rose-200 text-rose-900 shadow-rose-900/5': toast.type === 'danger'
           }">
        <span class="text-lg">
          <template x-if="toast.type === 'success'"><i class="fa-solid fa-circle-check text-green-500"></i></template>
          <template x-if="toast.type === 'warning'"><i
              class="fa-solid fa-circle-exclamation text-yellow-500"></i></template>
          <template x-if="toast.type === 'danger'"><i class="fa-solid fa-circle-xmark text-red-500"></i></template>
        </span>
        <div class="flex-1 font-semibold text-sm" x-text="toast.message"></div>
      </div>
    </template>
  </div>

  <header class="border-b border-white/20 bg-white/55 backdrop-blur-md shadow-sm sticky top-0 z-40">
    <div class="w-full max-w-full mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div @click="showAnnouncementsModal = true"
          class="cursor-pointer w-11 h-11 bg-gradient-to-tr from-black-700 to-emerald-400 rounded-xl flex items-center justify-center shadow-md text-white hover:scale-105 active:scale-95 transition-all duration-200"
          title="查看最新公告">
          <img src="logo_black.png" class="w-12 h-12 object-contain" alt="VegeTingyi Logo">
        </div>
        <div>
          <h1 class="font-bold text-lg text-slate-900 tracking-tight flex items-center gap-2">
            <span>VegeTingyi</span>
          </h1>
          <p class="text-xs text-slate-500 font-medium mt-0.5">蔬食點餐大廳</p>
        </div>
      </div>

      <nav class="tab-segment hidden md:inline-grid">
        <button @click="activeTab = 'client'; showHistoryModal = false"
          :class="['tab-button', activeTab === 'client' ? 'tab-active' : '']"
          class="px-5 py-2 text-sm transition-all duration-200 flex items-center justify-center gap-2">
          <span></span> 填寫點餐單
        </button>
        <button @click="openHistory()" :class="['tab-button', activeTab === 'history' ? 'tab-active' : '']"
          class="px-5 py-2 text-sm transition-all duration-200 flex items-center justify-center gap-2">
          <span></span> 歷史紀錄 (<span class="font-mono text-amber-800 font-bold" x-text="userHistory.length">0</span>)
        </button>
      </nav>

      <div class="flex items-center gap-1.5 bg-white/50 backdrop-blur-sm border border-slate-200 rounded-xl px-1.5 py-1"
        title="文字大小調整">
        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider pl-1 hidden sm:inline">字級</span>
        <button @click="fontSizeLevel = 0"
          :class="fontSizeLevel === 0 ? 'bg-amber-700 text-white shadow-sm' : 'text-slate-500 hover:bg-slate-100'"
          class="w-7 h-7 rounded-lg font-black transition-all duration-150 flex items-center justify-center"
          style="font-size: 11px;" title="小字">A</button>
        <button @click="fontSizeLevel = 1"
          :class="fontSizeLevel === 1 ? 'bg-amber-700 text-white shadow-sm' : 'text-slate-500 hover:bg-slate-100'"
          class="w-7 h-7 rounded-lg font-black transition-all duration-150 flex items-center justify-center"
          style="font-size: 14px;" title="標準字">A</button>
        <button @click="fontSizeLevel = 2"
          :class="fontSizeLevel === 2 ? 'bg-amber-700 text-white shadow-sm' : 'text-slate-500 hover:bg-slate-100'"
          class="w-7 h-7 rounded-lg font-black transition-all duration-150 flex items-center justify-center"
          style="font-size: 17px;" title="大字">A</button>
      </div>
    </div>
  </header>

  <main x-show="activeTab === 'client'" x-transition.opacity
    class="flex-1 w-full max-w-full mx-auto min-w-0 px-4 sm:px-6 lg:px-8 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
    <aside class="hidden lg:block lg:col-span-4 space-y-6">
      <div class="glass-panel p-5 space-y-4">
        <div class="flex items-center gap-3">
          <span class="text-lg p-2 bg-amber-800/10 text-amber-800 rounded-xl font-bold">
            <i class="fa-solid fa-bullhorn"></i>
          </span>
          <div>
            <h2 class="font-bold text-base text-slate-900">最新公告</h2>
            <p class="text-xs text-slate-500">營業時間及系統公告</p>
          </div>
        </div>

        <div class="relative overflow-hidden rounded-3xl border border-slate-200 bg-white/70 shadow-sm">
          <img :src="photoSlides[currentSlideIndex].src" :alt="photoSlides[currentSlideIndex].label"
            class="w-full h-56 object-cover transition-all duration-700 ease-out">
          <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-slate-950/80 to-transparent p-4">
            <p class="text-xs text-slate-200 uppercase tracking-[0.2em]">來看看</p>
            <p class="text-sm font-bold text-white" x-text="photoSlides[currentSlideIndex].label"></p>
          </div>
        </div>

        <div class="flex items-center justify-center gap-2">
          <template x-for="(slide, idx) in photoSlides" :key="idx">
            <button type="button" @click="currentSlideIndex = idx"
              :class="idx === currentSlideIndex ? 'bg-amber-700' : 'bg-slate-300'"
              class="w-2.5 h-2.5 rounded-full transition-all"></button>
          </template>
        </div>

        <div class="space-y-3 bg-slate-50 p-4 rounded-3xl border border-slate-200 overflow-hidden">
          <div class="flex items-center justify-between mb-2">
            <h3 class="text-sm font-bold text-slate-900">公告重點</h3>
            <span class="text-[10px] font-semibold uppercase tracking-[0.2em] text-slate-400">近期更新</span>
          </div>
          <template x-for="(item, index) in announcements" :key="index">
            <div class="border-b border-slate-200 last:border-b-0 pb-3 last:pb-0">
              <p class="text-xs font-semibold text-amber-800" x-text="item.title"></p>
              <p class="text-xs text-slate-600 mt-1 whitespace-pre-wrap break-words" x-text="item.body"></p>
            </div>
          </template>
        </div>
      </div>
    </aside>

    <section class="lg:col-span-8 w-full space-y-6">

      <div class="glass-panel p-6 space-y-5">
        <div class="flex items-center justify-between border-b border-amber-900/5 pb-4">
          <div class="flex items-center gap-3">
            <span class="text-lg p-2 bg-amber-800/10 text-amber-800 rounded-xl font-bold">
              <i class="fa-solid fa-clipboard-list"></i>
            </span>
            <div>
              <h2 class="font-bold text-base text-slate-900">訂購基本資訊</h2>
              <p class="text-xs text-slate-500 font-medium mt-0.5">請確實輸入，以利後台配餐</p>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">訂購單位<span
                class="text-rose-500">*</span></label>
            <input type="text" x-model="clientForm.unit" placeholder="例如：庭藝素食館"
              class="w-full glass-input rounded-xl px-4 py-3 text-sm font-medium focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">聯絡電話<span
                class="text-rose-500">*</span></label>
            <input type="tel" x-model="clientForm.userPhone" placeholder="例如：0912345678"
              class="w-full glass-input rounded-xl px-4 py-3 text-sm font-medium focus:outline-none">
          </div>
          <div class="sm:col-span-2">
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
              配送地址 <span class="text-slate-400 font-normal normal-case tracking-normal ml-1">（選填）</span>
            </label>
            <div class="relative">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"><i
                  class="fa-solid fa-location-dot"></i></span>
              <input type="text" x-model="clientForm.deliveryAddress" placeholder="如新客戶、新地址需填寫地址，其餘可留空"
                class="w-full glass-input rounded-xl pl-8 pr-3 py-3 text-sm font-medium focus:outline-none">
            </div>
          </div>
        </div>

        <div
          class="pt-2 flex flex-wrap gap-6 items-center justify-between bg-amber-900/[0.02] rounded-xl p-4 border border-dashed border-amber-700/20">
          <div class="flex items-center gap-3">
          </div>

          <button @click="toggleCustomization()"
            class="text-xs font-bold px-4 py-2 rounded-xl border flex items-center gap-2 transition-all shadow-sm glass-btn"
            :class="clientForm.isCustomized ? 'bg-amber-500/10 text-amber-700 border-amber-300' : 'text-slate-600 border-slate-200'">
            <template x-if="clientForm.isCustomized">
              <span class="inline-flex items-center gap-2">
                <span>切換為</span><i class="fa-solid fa-arrow-right text-[10px]"></i><span>團體單一規格</span>
              </span>
            </template>
            <template x-if="!clientForm.isCustomized">
              <span class="inline-flex items-center gap-2">
                <span>開放</span><i class="fa-solid fa-arrow-right text-[10px]"></i><span>每位同仁餐點客製</span>
              </span>
            </template>
          </button>
        </div>
      </div>

      <div x-show="!clientForm.isCustomized" x-transition.opacity class="glass-panel p-6 space-y-6">
        <div class="flex items-center justify-between border-b border-amber-900/5 pb-4">
          <div class="flex items-center gap-3">
            <span class="text-lg p-2 bg-amber-800/10 text-amber-800 rounded-xl font-bold">
              <i class="fa-solid fa-box-open"></i>
            </span>
            <div>
              <h2 class="font-bold text-base text-slate-900">您需要的餐點 (全體一致)</h2>
              <p class="text-xs text-slate-500 font-medium mt-0.5">批量點餐、全體同仁主菜相同</p>
            </div>
          </div>
          <div class="w-24">
            <label
              class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1 text-right">訂購數量</label>
            <input type="number" min="1" max="100" x-model.number="clientForm.singleBento.quantity"
              class="w-full glass-input rounded-xl px-3 py-1.5 text-sm font-bold text-center text-amber-800 focus:outline-none">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-5">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">預算價位</label>
            <select x-model="clientForm.singleBento.price" @change="filterMainDishes(clientForm.singleBento)"
              class="w-full glass-input rounded-xl px-3 py-2.5 text-sm font-medium focus:outline-none">
              <option value="80">NT$ 80 </option>
              <option value="90">NT$ 90 </option>
              <option value="100">NT$ 100 </option>
              <option value="110">NT$ 110 </option>
              <option value="other">自訂其他金額</option>
            </select>
            <template x-if="clientForm.singleBento.price === 'other'">
              <input type="number" x-model="clientForm.singleBento.otherPrice"
                @input="filterMainDishes(clientForm.singleBento)" placeholder="輸入金額"
                class="w-full mt-2 glass-input rounded-xl px-3 py-1.5 text-xs font-bold focus:outline-none text-center">
            </template>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">素食選別</label>
            <select x-model="clientForm.singleBento.vegType" @change="filterMainDishes(clientForm.singleBento)"
              class="w-full glass-input rounded-xl px-3 py-2.5 text-sm font-medium focus:outline-none">
              <template x-for="type in vegTypeOptions" :key="type">
                <option :value="type" x-text="type"></option>
              </template>
            </select>
          </div>

          <div class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">飯別</label>
              <select x-model="clientForm.singleBento.riceType"
                class="w-full glass-input rounded-xl px-3 py-2.5 text-sm font-medium focus:outline-none">
                <option value="">請選擇飯別</option>
                <template x-for="type in riceTypeOptions" :key="type">
                  <option :value="type" x-text="type"></option>
                </template>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">飯量調整</label>
              <select x-model="clientForm.singleBento.rice" :disabled="!clientForm.singleBento.riceType"
                :class="!clientForm.singleBento.riceType ? 'opacity-70 cursor-not-allowed' : ''"
                class="w-full glass-input rounded-xl px-3 py-2.5 text-sm font-medium focus:outline-none">
                <option value="正常">正常</option>
                <option value="半飯">半飯(1/2)</option>
                <option value="少飯">少飯(1/3)</option>
                <option value="多飯">多飯(2/3)</option>
                <option value="不飯菜多">不飯菜多</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">精選主餐（最多顯示 5 項）</label>
            <select x-model="clientForm.singleBento.mainDish"
              class="w-full glass-input text-amber-900 font-bold rounded-xl px-3 py-2.5 text-sm focus:outline-none">
              <template x-if="getAvailableDishesForPrice(clientForm.singleBento).length === 0">
                <option disabled>目前尚無精選主餐，請管理員上架</option>
              </template>
              <template x-for="dish in getAvailableDishesForPrice(clientForm.singleBento)" :key="dish.id">
                <option :value="dish.name" x-text="dish.name + ' · ' + dish.vegType"></option>
              </template>
            </select>
          </div>
        </div>

        <div class="space-y-3 bg-amber-900/[0.02] p-4 rounded-xl border border-amber-700/10">
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider">忌口菜色</label>
          <div class="flex flex-wrap gap-2">
            <template x-for="opt in dislikesOptions" :key="opt">
              <button type="button" @click="toggleDislikeInRow(clientForm.singleBento, opt)"
                :class="clientForm.singleBento.dislikes.includes(opt) ? 'bg-rose-500/10 text-rose-700 border-rose-300 shadow-sm' : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50'"
                class="px-3 py-1.5 text-xs font-semibold rounded-xl border transition-all">
                <i class="fa-solid fa-xmark mr-1 text-[10px]"></i><span x-text="opt"></span>
              </button>
            </template>
          </div>
          <div class="pt-1">
            <input type="text" x-model="clientForm.singleBento.otherDislike" placeholder="其餘客製化忌口或特別交代，請在此補充備註..."
              class="w-full glass-input rounded-xl px-3 py-2 text-xs font-medium focus:outline-none">
          </div>
        </div>
      </div>

      <div x-show="clientForm.isCustomized" x-transition.opacity class="glass-panel p-6 space-y-4"
        @keydown.window="handleCustomCarouselArrow($event)">
        <div class="flex flex-wrap items-center justify-between border-b border-amber-900/5 pb-4 gap-3">
          <div class="flex items-center gap-3">
            <span class="text-lg p-2 bg-amber-500/10 text-amber-700 rounded-xl font-bold">
              <i class="fa-solid fa-users"></i>
            </span>
            <div>
              <h2 class="font-bold text-base text-slate-900">客製化訂單</h2>
              <p class="text-xs text-slate-500 font-medium mt-0.5">可為同仁客製化價位、飯量、主菜與忌口項目</p>
            </div>
          </div>
          <div class="flex flex-wrap gap-2 items-center">
            <button type="button" @click="copyAllCustomBentos()"
              class="glass-btn text-slate-800 bg-slate-100 hover:bg-slate-200 text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-1.5">
              <i class="fa-solid fa-copy"></i><span>複製全部</span>
            </button>

          </div>

              <i class="fa-solid fa-utensils text-amber-700 text-sm"></i>

                <p class="text-sm font-bold text-slate-700">需要免洗筷</p>

              </div>
            </label>

              </div>
            </label>

            <span class="text-lg text-amber-950 font-bold tracking-wider">總計</span>
            <div class="flex items-center gap-2">
              <span
                class="text-[10px] bg-white/10 border border-white/10 px-2.5 py-0.5 rounded-full font-mono font-bold text-amber-950"
                x-text="clientForm.needTableware ? '含免費免洗餐具' : '不需餐具 · 環保減塑'"></span>
              <template x-if="clientForm.needReceipt">
                <span
                  class="text-[10px] bg-amber-400/30 border border-amber-400/40 px-2.5 py-0.5 rounded-full font-bold text-amber-900">附收據</span>
              </template>
            </div>
          </div>

          <div class="space-y-2 max-h-[140px] overflow-y-auto custom-scrollbar pr-1">
            <template x-for="(item, i) in getOrderSummaryItems()" :key="i">
              <div class="flex justify-between items-center text-xs font-medium text-amber-950">
                <span x-text="item.label"></span>
                <span class="font-mono text-amber-950 font-bold" x-text="item.val"></span>
              </div>
            </template>
            <template x-if="clientForm.deliveryAddress">
              <div class="flex justify-between items-center text-xs font-medium text-amber-950">

                <span class="font-mono text-amber-950 font-bold truncate max-w-[60%] text-right"

              </div>

          </div>

          <div class="pt-3 border-t border-white/10 flex justify-between items-baseline">
            <span class="text-lg font-bold text-amber-950">應付金額</span>

              <i class="fa-solid fa-pen-to-square text-amber-500 text-sm"></i>
              <div>
                <p class="text-xs font-black">編輯模式｜正在修改訂單</p>

          <span x-text="editingOrderId ? '更新訂單（同步後台）' : '確認訂單'"></span>

          </template>

          <template x-for="order in userHistory" :key="order.id">

                <div>
                  <span class="text-slate-900 font-mono text-sm" x-text="order.id"></span>

                      'bg-yellow-100 text-yellow-800': order.status === '已接單',

              <div class="text-right font-bold text-slate-900 pt-1">

              </div>
            </div>
          </template>
        </div>
      </div>
    </div>

              <div>
                <span class="text-slate-900 font-mono text-sm" x-text="order.id"></span>
                <p class="text-[10px] text-slate-400 mt-0.5" x-text="'保留至：' + getHistoryExpireLabel(order)"></p>
              </div>
              <div class="flex items-center gap-1.5">
                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-black" :class="{
                    'bg-red-100 text-red-800': order.status === '未接單',
                    'bg-rose-100 text-rose-800': order.status === '店家拒絕',
                    'bg-yellow-100 text-yellow-800': order.status === '已接單',
                    'bg-blue-100 text-blue-800': order.status === '製作中',
                    'bg-emerald-100 text-emerald-800': order.status === '已送出'
                  }" x-text="order.status"></span>
                <button type="button" @click="editHistoryOrder(order)" title="再次點餐並可編輯"
                  class="glass-btn text-slate-700 bg-white/70 hover:bg-slate-100 border border-slate-200 text-[11px] font-bold rounded-xl px-3 py-2 transition-all flex items-center gap-1">
                  <i class="fa-solid fa-repeat text-[10px]"></i><span>再次點餐</span>
                </button>
                <button type="button" @click="deleteHistoryOrder(order.id)" title="刪除此筆歷史紀錄"
                  class="w-7 h-7 rounded-lg bg-white/70 border border-slate-200 text-slate-600 hover:text-rose-700 hover:border-rose-300 transition-all">
                  <i class="fa-regular fa-trash-can"></i>
                </button>
              </div>
            </div>
            <template x-if="order.status === '店家拒絕'">
              <div class="rounded-2xl border border-rose-200 bg-rose-50 p-3 text-rose-800 text-xs font-bold">
                <p>本訂單已被店家拒絕，請重新確認訂單內容或直接聯繫賣家。</p>
              </div>
            </template>
            <div class="text-slate-500 grid grid-cols-2 gap-1 font-medium">
              <p>訂購單位：<span class="text-slate-800" x-text="order.unit"></span></p>
              <p>主要負責人：<span class="text-slate-800" x-text="order.userName"></span></p>
              <p>發送時間：<span class="text-slate-800 font-mono" x-text="order.timestamp"></span></p>
              <p>指定送達：<span class="text-slate-800" x-text="order.deliveryTime || '儘速送達'"></span></p>
              <p>餐具：
                <span class="text-slate-800" aria-label="餐具需求">
                  <template x-if="order.needTableware">
                    <i class="fa-solid fa-utensils text-amber-800"></i>
                  </template>
                  <template x-if="!order.needTableware">
                    <i class="fa-solid fa-xmark text-rose-500"></i>
                  </template>
                </span>
              </p>
              <p>收據：
                <span class="text-slate-800" aria-label="收據需求">
                  <template x-if="order.needReceipt">
                    <i class="fa-solid fa-receipt text-amber-800"></i>
                  </template>
                  <template x-if="!order.needReceipt">
                    <i class="fa-solid fa-xmark text-rose-500"></i>
                  </template>
                </span>
              </p>
            </div>
            <div class="bg-white/40 p-2 rounded-xl border border-slate-100 space-y-1">
              <template x-for="(it, idx) in getOrderDisplayItems(order)" :key="idx">
                <div class="flex justify-between text-slate-600">
                  <span x-text="it.summary"></span>
                  <span class="font-mono font-bold text-slate-900" x-text="'x'+it.count"></span>
                </div>
              </template>
            </div>
            <div class="text-right font-bold text-slate-900 pt-1">
              總計金額：<span class="text-amber-800 font-mono text-sm" x-text="'NT$ ' + order.totalAmount"></span>
            </div>
          </div>
        </template>
      </div>

      <div class="pt-2 border-t border-slate-200 flex justify-end">
        <button @click="closeHistory()"
          class="glass-btn text-slate-700 px-4 py-2 rounded-xl text-xs font-bold">關閉視窗</button>
      </div>
    </div>
  </div>

  <div x-show="showAnnouncementsModal" x-cloak
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm">
    <div
      class="liquid-glass-modal rounded-3xl max-w-xl w-full max-h-[85vh] overflow-hidden bg-white/95 shadow-2xl flex flex-col">
      <div class="flex items-center justify-between border-b border-slate-200 p-5">
        <div>
          <h3 class="text-lg font-black text-slate-900">最新公告</h3>
          <p class="text-sm text-slate-500 mt-1">點擊左上圖示即可快速查看公告內容</p>
        </div>
        <button @click="closeAnnouncements()" class="text-slate-500 hover:text-slate-900 text-xl p-2">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="overflow-y-auto p-5 space-y-4">
        <template x-if="announcements.length === 0">
          <div class="text-center py-12 text-slate-400 space-y-2">
            <div class="text-3xl"><i class="fa-solid fa-inbox"></i></div>
            <p class="text-sm font-medium">目前尚無最新公告</p>
          </div>
        </template>
        <template x-for="(item, index) in announcements" :key="index">
          <div class="rounded-3xl border border-slate-200 p-4 bg-slate-50">
            <p class="text-sm font-bold text-amber-800" x-text="item.title"></p>
            <p class="mt-2 text-sm text-slate-700 whitespace-pre-wrap break-words" x-text="item.body"></p>
          </div>
        </template>
      </div>
    </div>
  </div>

  <footer
    class="bg-white/40 backdrop-blur-md border-t border-white/20 py-4 text-center text-xs text-slate-600 relative z-10">
    <p>VegeTingyi 蔬食點餐系統 ©</p>
  </footer>

  <!-- ══ 手機底部 Tab Bar ══ -->
  <nav
    class="mobile-tab-bar fixed bottom-0 inset-x-0 z-40 bg-white/85 backdrop-blur-xl border-t border-slate-200 shadow-[0_-4px_24px_rgba(0,0,0,0.06)]">
    <button class="mobile-tab-btn relative" :class="activeTab === 'client' ? 'active' : ''"
      @click="activeTab = 'client'; showHistoryModal = false">
      <i class="fa-solid fa-clipboard-list"></i>
      <span>點餐單</span>
    </button>
    <button class="mobile-tab-btn relative" :class="activeTab === 'history' ? 'active' : ''"
      @click="activeTab = 'history'; showHistoryModal = false">
      <i class="fa-solid fa-clock-rotate-left"></i>
      <span>歷史紀錄</span>
      <span class="badge" x-show="userHistory.length > 0" x-text="userHistory.length"></span>
    </button>
  </nav>

  <script>
    function bentoApp() {
      return {
        activeTab: 'client',
        showHistoryModal: false,
        showAnnouncementsModal: false,
        dislikesOptions: ['花椰菜', '咖哩', '茄子', '炸物', '素料', '青椒', '豆子', '苦瓜', '皇宮菜', '秋葵'],
        vegTypeOptions: ['全素', '蛋奶素', '奶素'],
        riceTypeOptions: ['紫米飯', '白飯'],

        // 全域共用資料池
        orders: [],
        userHistory: [],
        mainDishes: [],

        // 編輯模式：記錄正在修改的原始訂單 ID（null 表示新增模式）
        editingOrderId: null,
        isSubmitting: false,

        toast: { show: false, message: '', type: 'success' },

        currentSlideIndex: 0,
        currentCustomIndex: 0,
        photoSlides: [
          { src: 'https://zh.wikipedia.org/zh-tw/%E7%99%BD%E6%97%97#/media/File:Flag_white.svg', label: '本週新品上架，歡迎試吃' },
          { src: 'https://zh.wikipedia.org/zh-tw/%E7%99%BD%E6%97%97#/media/File:Flag_white.svg', label: '營養師推薦：季節蔬食套餐' },
          { src: 'https://zh.wikipedia.org/zh-tw/%E7%99%BD%E6%97%97#/media/File:Flag_white.svg', label: '外送服務提醒：請於 12:00 前完成訂單' }
        ],
        announcements: [],
        fontSizeLevel: 1,
        clientForm: {
          unit: '',
          userName: '',
          userPhone: '',
          vegType: '全素',
          needTableware: false,
          needReceipt: false,
          deliveryAddress: '',
          isCustomized: false,
          deliveryTimeType: 'ASAP',
          deliveryTimeValue: '12:00',
          globalNote: '',
          singleBento: { price: '80', otherPrice: '', vegType: '全素', riceType: '', rice: '正常', mainDish: '', dislikes: [], otherDislike: '', quantity: 1 },
          customBentos: [
            { name: '同仁 1', price: '80', otherPrice: '', vegType: '全素', riceType: '', rice: '正常', mainDish: '', dislikes: [], otherDislike: '' }
          ]
        },

        async init() {
          // 初始化時套用已儲存的字級設定
          document.documentElement.style.fontSize =
            this.fontSizeLevel === 0 ? '14px' : this.fontSizeLevel === 2 ? '18px' : '16px';
          await this.loadDataFromStorage();
          await this.applyClientFontSizeSetting();
          this.autoSelectFirstAvailableDish();
          if (this.photoSlides && this.photoSlides.length > 1) {
            setInterval(() => {
              this.currentSlideIndex = (this.currentSlideIndex + 1) % this.photoSlides.length;
            }, 5000);
          }
        },

        async applyClientFontSizeSetting() {
          const settings = await VegeBentoDB.getAdminSettings();
          if (settings && settings.clientFontSize) {
            document.documentElement.style.fontSize = settings.clientFontSize + 'px';
          }
        },

        async loadDataFromStorage() {
          // 透過 DB Helper 從 Supabase (或自動降級的 LocalStorage) 撈取資料
          const dishes = await VegeBentoDB.getDishes();
          this.mainDishes = dishes.map(dish => {
            const normalized = {
              ...dish,
              vegType: dish.vegType || '全素'
            };
            if (!normalized.priceType && normalized.priceRange) {
              normalized.priceType = normalized.priceRange === 'all' ? 'all' : 'range';
              normalized.specificPrice = normalized.priceRange === 'all' ? '' : (String(normalized.priceRange).match(/\d+/) || [''])[0];
              delete normalized.priceRange;
            }
            if (!normalized.priceType) {
              normalized.priceType = 'all';
              normalized.specificPrice = '';
            }
            return normalized;
          });

          const slides = await VegeBentoDB.getPhotoSlides();
          if (slides && slides.length > 0) {
            this.photoSlides = slides;
          }

          const anns = await VegeBentoDB.getAnnouncements();
          if (anns && anns.length > 0) {
            this.announcements = anns;
          }

          const dbOrders = await VegeBentoDB.getOrders();
          this.orders = dbOrders;

          const personalHistory = localStorage.getItem('vege_bento_user_history');
          this.userHistory = this.cleanupUserHistory(personalHistory ? JSON.parse(personalHistory) : []);
          this.syncUserHistoryWithOrders();
        },

        saveUserHistory() {
          localStorage.setItem('vege_bento_user_history', JSON.stringify(this.userHistory));
        },

        syncUserHistoryWithOrders() {
          const orderMap = new Map(this.orders.map(order => [order.id, order]));
          this.userHistory = this.userHistory.map(order => {
            const remote = orderMap.get(order.id);
            if (remote) {
              return {
                ...order,
                status: remote.status,
                needTableware: remote.needTableware,
                needReceipt: remote.needReceipt
              };
            }
            // 若此筆歷史訂單已從賣家端消失，顯示為「店家拒絕」狀態
            if (['未接單', '已接單', '製作中'].includes(order.status)) {
              return { ...order, status: '店家拒絕' };
            }
            return order;
          });
          this.saveUserHistory();
        },

        cleanupUserHistory(history) {
          const now = Date.now();
          const threeDaysMs = 3 * 24 * 60 * 60 * 1000;
          const normalized = history.map(order => ({
            ...order,
            createdAt: order.createdAt || new Date().toISOString()
          })).filter(order => {
            const createdAt = Date.parse(order.createdAt);
            return Number.isFinite(createdAt) && now - createdAt < threeDaysMs;
          }).slice(0, 20);
          localStorage.setItem('vege_bento_user_history', JSON.stringify(normalized));
          return normalized;
        },

        getHistoryExpireLabel(order) {
          const createdAt = Date.parse(order.createdAt);
          if (!Number.isFinite(createdAt)) return '3 天後';
          const expiresAt = new Date(createdAt + 3 * 24 * 60 * 60 * 1000);
          return expiresAt.toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
        },

        isDishCompatibleWithVegType(dish, selectedType) {
          const priority = { '全素': 0, '奶素': 1, '蛋奶素': 2 };
          const dishPriority = priority[dish.vegType] ?? 0;
          const selectedPriority = priority[selectedType] ?? 0;
          return dishPriority <= selectedPriority;
        },

        getAvailableDishesForPrice(bentoTarget) {
          const targetPrice = bentoTarget.price === 'other' ? parseInt(bentoTarget.otherPrice || 0) : parseInt(bentoTarget.price);
          return this.mainDishes.filter(dish => {
            if (!dish.available) return false;
            if (!this.isDishCompatibleWithVegType(dish, bentoTarget.vegType)) return false;
            if (dish.priceType === 'all') return true;
            if (dish.priceType === 'range') return targetPrice >= parseInt(dish.specificPrice || 0);
            return false;
          }).slice(0, 5);
        },

        autoSelectFirstAvailableDish() {
          // 團體單
          const singleAvailable = this.getAvailableDishesForPrice(this.clientForm.singleBento);
          if (singleAvailable.length > 0) this.clientForm.singleBento.mainDish = singleAvailable[0].name;

          // 客製單
          this.clientForm.customBentos.forEach(row => {
            const rowAvailable = this.getAvailableDishesForPrice(row);
            if (rowAvailable.length > 0 && !row.mainDish) row.mainDish = rowAvailable[0].name;
          });
        },

        filterMainDishes(bentoTarget) {
          const available = this.getAvailableDishesForPrice(bentoTarget);
          bentoTarget.mainDish = available.length > 0 ? available[0].name : '無可供應主菜';
        },

        openHistory() {
          this.activeTab = 'history';
          // 手機以行內顯示，桌面也改為行內 Tab，不再開 modal
          this.showHistoryModal = false;
        },

        closeHistory() {
          this.showHistoryModal = false;
          this.activeTab = 'client';
        },

        openAnnouncements() {
          this.showAnnouncementsModal = true;
        },

        closeAnnouncements() {
          this.showAnnouncementsModal = false;
        },

        async deleteHistoryOrder(orderId) {
          // 從個人歷史紀錄移除
          this.userHistory = this.userHistory.filter(order => order.id !== orderId);
          this.saveUserHistory();
          // 同步刪除主資料庫（Supabase + LocalStorage），後台即時同步
          await VegeBentoDB.deleteOrder(orderId);
          this.orders = this.orders.filter(o => o.id !== orderId);
          // 若此單正處於編輯模式，一併清除
          if (this.editingOrderId === orderId) this.editingOrderId = null;
          this.showToast('已刪除此筆訂單，後台已同步移除。', 'warning');
        },

        editHistoryOrder(order) {
          // 記錄原始訂單 ID，送出時舊單將被刪除並以新單取代
          this.editingOrderId = order.id;

          this.clientForm.unit = order.unit || '';
          this.clientForm.userName = order.userName || '';
          this.clientForm.userPhone = order.userPhone || '';
          this.clientForm.needTableware = !!order.needTableware;
          this.clientForm.needReceipt = !!order.needReceipt;
          this.clientForm.deliveryAddress = order.deliveryAddress || '';
          this.clientForm.globalNote = order.note || '';
          this.clientForm.deliveryTimeType = order.deliveryTime && order.deliveryTime !== '儘速送達' ? 'SPECIFIC' : 'ASAP';
          this.clientForm.deliveryTimeValue = this.clientForm.deliveryTimeType === 'SPECIFIC' ? order.deliveryTime : '12:00';

          this.clientForm.isCustomized = !!order.isCustomized;
          if (this.clientForm.isCustomized) {
            this.clientForm.customBentos = (order.items || []).map((item, idx) => this.historyItemToFormRow(item, `同仁 ${idx + 1}`));
          } else {
            const firstItem = (order.items || [])[0] || {};
            this.clientForm.singleBento = {
              ...this.historyItemToFormRow(firstItem, '統一餐盒'),
              quantity: Math.max(1, (order.items || []).length)
            };
          }
          this.closeHistory();
          this.showToast('已帶回歷史訂單，修改後按「更新訂單」即可同步後台。', 'warning');
        },

        historyItemToFormRow(item, fallbackName) {
          const price = parseInt(item.price || 80);
          return {
            name: item.name || fallbackName,
            price: [80, 90, 100, 110, 120].includes(price) ? String(price) : 'other',
            otherPrice: [80, 90, 100, 110, 120].includes(price) ? '' : String(price),
            vegType: item.vegType || '全素',
            riceType: item.riceType || '',
            rice: item.rice || '正常',
            mainDish: item.mainDish || '',
            dislikes: Array.isArray(item.dislikes) ? [...item.dislikes] : [],
            otherDislike: item.otherDislike || ''
          };
        },

        toggleCustomization() {
          this.clientForm.isCustomized = !this.clientForm.isCustomized;
          this.currentCustomIndex = 0;
          this.autoSelectFirstAvailableDish();
          this.$nextTick(() => this.scrollCustomRowIntoView());
        },

        setCurrentCustomIndex(index) {
          this.currentCustomIndex = index;
          this.$nextTick(() => this.scrollCustomRowIntoView());
        },

        moveCustomIndex(delta) {
          const nextIndex = this.currentCustomIndex + delta;
          if (nextIndex < 0 || nextIndex >= this.clientForm.customBentos.length) return;
          this.currentCustomIndex = nextIndex;
          this.$nextTick(() => this.scrollCustomRowIntoView());
        },

        handleCustomCarouselArrow(event) {
          const tag = event.target.tagName;
          if (['INPUT', 'TEXTAREA', 'SELECT', 'BUTTON'].includes(tag) || event.target.isContentEditable) return;
          if (!this.clientForm.isCustomized || this.clientForm.customBentos.length <= 1) return;
          if (event.key === 'ArrowRight') {
            event.preventDefault();
            this.moveCustomIndex(1);
          }
          if (event.key === 'ArrowLeft') {
            event.preventDefault();
            this.moveCustomIndex(-1);
          }
        },

        scrollCustomRowIntoView() {
          const container = document.querySelector('.custom-bento-carousel');
          const card = container?.querySelector(`[data-index="${this.currentCustomIndex}"]`);
          if (container && card) {
            card.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
          }
        },

        addCustomBentoRow() {
          const nextIndex = this.clientForm.customBentos.length + 1;
          const newRow = { name: `同仁 ${nextIndex}`, price: '80', otherPrice: '', vegType: '全素', riceType: '', rice: '正常', mainDish: '', dislikes: [], otherDislike: '' };
          this.clientForm.customBentos.push(newRow);
          this.filterMainDishes(newRow);
          this.currentCustomIndex = this.clientForm.customBentos.length - 1;
          this.$nextTick(() => this.scrollCustomRowIntoView());
        },

        copyCustomBentoRow(row) {
          const nextIndex = this.clientForm.customBentos.length + 1;
          const newRow = {
            name: row.name ? `${row.name} 複製` : `同仁 ${nextIndex}`,
            price: row.price,
            otherPrice: row.otherPrice,
            vegType: row.vegType,
            riceType: row.riceType,
            rice: row.rice,
            mainDish: row.mainDish,
            dislikes: Array.isArray(row.dislikes) ? [...row.dislikes] : [],
            otherDislike: row.otherDislike
          };
          if (!newRow.name.trim()) newRow.name = `同仁 ${nextIndex}`;
          const available = this.getAvailableDishesForPrice(newRow);
          newRow.mainDish = available.some(dish => dish.name === newRow.mainDish)
            ? newRow.mainDish
            : (available[0]?.name || '');
          this.clientForm.customBentos.push(newRow);
          this.currentCustomIndex = this.clientForm.customBentos.length - 1;
          this.$nextTick(() => this.scrollCustomRowIntoView());
        },

        copyAllCustomBentos() {
          if (this.clientForm.customBentos.length === 0) {
            this.showToast('目前沒有可複製的客製餐點。', 'warning');
            return;
          }
          const originalCount = this.clientForm.customBentos.length;
          const copies = this.clientForm.customBentos.map((row, idx) => {
            const copyIndex = originalCount + idx + 1;
            return {
              name: row.name ? `${row.name} 複製` : `同仁 ${copyIndex}`,
              price: row.price,
              otherPrice: row.otherPrice,
              vegType: row.vegType,
              riceType: row.riceType,
              rice: row.rice,
              mainDish: row.mainDish,
              dislikes: Array.isArray(row.dislikes) ? [...row.dislikes] : [],
              otherDislike: row.otherDislike
            };
          });
          copies.forEach(row => {
            const available = this.getAvailableDishesForPrice(row);
            row.mainDish = available.some(dish => dish.name === row.mainDish)
              ? row.mainDish
              : (available[0]?.name || '');
            this.clientForm.customBentos.push(row);
          });
          this.showToast(`已複製 ${originalCount} 筆客製餐點。`, 'success');
        },

        removeCustomBentoRow(index) {
          if (this.clientForm.customBentos.length > 1) {
            this.clientForm.customBentos.splice(index, 1);
            if (this.currentCustomIndex >= this.clientForm.customBentos.length) {
              this.currentCustomIndex = Math.max(this.clientForm.customBentos.length - 1, 0);
            }
            this.$nextTick(() => this.scrollCustomRowIntoView());
          }
        },

        toggleDislikeInRow(row, opt) {
          if (row.dislikes.includes(opt)) {
            row.dislikes = row.dislikes.filter(d => d !== opt);
          } else {
            row.dislikes.push(opt);
          }
        },

        calculateTotal() {
          if (!this.clientForm.isCustomized) {
            const price = this.clientForm.singleBento.price === 'other' ? parseInt(this.clientForm.singleBento.otherPrice || 0) : parseInt(this.clientForm.singleBento.price);
            return price * (this.clientForm.singleBento.quantity || 1);
          } else {
            return this.clientForm.customBentos.reduce((sum, row) => {
              const price = row.price === 'other' ? parseInt(row.otherPrice || 0) : parseInt(row.price);
              return sum + price;
            }, 0);
          }
        },

        getOrderSummaryItems() {
          if (!this.clientForm.isCustomized) {
            const p = this.clientForm.singleBento.price === 'other' ? this.clientForm.singleBento.otherPrice : this.clientForm.singleBento.price;
            return [
              { label: `素食選別`, val: this.clientForm.singleBento.vegType },
              { label: `飯別`, val: this.clientForm.singleBento.riceType || '未選擇' },
              { label: `飯量`, val: this.clientForm.singleBento.rice },
              { label: `NT$ ${p} 單一規格餐盒`, val: `${this.clientForm.singleBento.quantity || 1} 個` }
            ];
          } else {
            // 分組彙整
            const summaryMap = {};
            this.clientForm.customBentos.forEach(row => {
              const p = row.price === 'other' ? row.otherPrice : row.price;
              const key = `NT$ ${p} 客製化餐盒`;
              summaryMap[key] = (summaryMap[key] || 0) + 1;
            });
            return [
              { label: '素食選別', val: this.clientForm.vegType },
              ...Object.keys(summaryMap).map(k => ({ label: k, val: `${summaryMap[k]} 個` }))
            ];
          }
        },

        getOrderDisplayItems(order) {
          const itemMap = new Map();
          (order.items || []).forEach(item => {
            const key = JSON.stringify({
              name: item.name,
              mainDish: item.mainDish,
              rice: item.rice,
              riceType: item.riceType,
              price: item.price,
              dislikes: (Array.isArray(item.dislikes) ? [...item.dislikes].sort() : []).join(','),
              otherDislike: item.otherDislike || ''
            });
            if (!itemMap.has(key)) {
              itemMap.set(key, {
                ...item,
                count: item.count || 1
              });
            } else {
              itemMap.get(key).count += item.count || 1;
            }
          });
          return [...itemMap.values()];
        },

        async submitOrder() {
          if (this.isSubmitting) {
            return;
          }
          this.isSubmitting = true;
          try {
            if (!this.clientForm.unit.trim()) {
              this.showToast('請務必填寫「訂購單位」！', 'danger');
              return;
            }
            if (!this.clientForm.userPhone.trim()) {
              this.showToast('請務必填寫「聯絡電話」，以利後續通知與配送。', 'danger');
              return;
            }
            if (!this.clientForm.singleBento.riceType && !this.clientForm.isCustomized) {
              this.showToast('請先選擇飯別，再選擇飯量。', 'danger');
              return;
            }
            if (this.clientForm.isCustomized) {
              const invalidRow = this.clientForm.customBentos.find(row => !row.riceType);
              if (invalidRow) {
                this.showToast('請為每位同仁選擇飯別後再送出訂單。', 'danger');
                return;
              }
            }

            // ── 編輯模式：先刪除舊單，再以新 ID 建立更新後的訂單 ──
            const wasEditing = !!this.editingOrderId;
            if (wasEditing) {
              await VegeBentoDB.deleteOrder(this.editingOrderId);
              this.orders = this.orders.filter(o => o.id !== this.editingOrderId);
              this.userHistory = this.userHistory.filter(o => o.id !== this.editingOrderId);
              this.editingOrderId = null;
            }

            let items = [];
            if (!this.clientForm.isCustomized) {
              const priceVal = this.clientForm.singleBento.price === 'other' ? this.clientForm.singleBento.otherPrice : this.clientForm.singleBento.price;
              let disStr = this.clientForm.singleBento.dislikes.join(',') + (this.clientForm.singleBento.otherDislike ? ' ' + this.clientForm.singleBento.otherDislike : '');
              const quantity = parseInt(this.clientForm.singleBento.quantity || 1);
              for (let i = 0; i < quantity; i++) items.push({
                name: '統一餐盒',
                vegType: this.clientForm.singleBento.vegType,
                price: parseInt(priceVal || 0),
                riceType: this.clientForm.singleBento.riceType,
                rice: this.clientForm.singleBento.rice,
                mainDish: this.clientForm.singleBento.mainDish || '未指定',
                dislikes: [...this.clientForm.singleBento.dislikes],
                otherDislike: this.clientForm.singleBento.otherDislike,
                summary: `[統一單] ${this.clientForm.singleBento.vegType} | NT$${priceVal} | 主菜: ${this.clientForm.singleBento.mainDish} | 飯別: ${this.clientForm.singleBento.riceType} | 飯量: ${this.clientForm.singleBento.rice} ${disStr ? '| 忌口: ' + disStr : ''}`,
                count: 1
              });
            } else {
              this.clientForm.customBentos.forEach(row => {
                const priceVal = row.price === 'other' ? row.otherPrice : row.price;
                let disStr = row.dislikes.join(',') + (row.otherDislike ? ' ' + row.otherDislike : '');
                items.push({
                  name: row.name,
                  vegType: row.vegType,
                  price: parseInt(priceVal || 0),
                  riceType: row.riceType,
                  rice: row.rice,
                  mainDish: row.mainDish || '未指定',
                  dislikes: [...row.dislikes],
                  otherDislike: row.otherDislike,
                  summary: `[${row.name}] ${row.vegType} | NT$${priceVal} | 主菜: ${row.mainDish} | 飯別: ${row.riceType} | 飯量: ${row.rice} ${disStr ? '| 忌口: ' + disStr : ''}`,
                  count: 1
                });
              });
            }

            const finalDeliveryTime = this.clientForm.deliveryTimeType === 'SPECIFIC' ? this.clientForm.deliveryTimeValue : '儘速送達';
            const orderId = 'VEG-' + Math.floor(1000 + Math.random() * 9000);
            const timeNow = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
            const createdAt = new Date().toISOString();

            const newOrder = {
              id: orderId,
              createdAt: createdAt,
              unit: this.clientForm.unit,
              userName: this.clientForm.userName,
              userPhone: this.clientForm.userPhone,
              timestamp: timeNow,
              isCustomized: this.clientForm.isCustomized,
              needTableware: this.clientForm.needTableware,
              needReceipt: this.clientForm.needReceipt,
              items: items,
              totalAmount: this.calculateTotal(),
              status: '未接單',
              deliveryAddress: this.clientForm.deliveryAddress,
              deliveryTime: finalDeliveryTime,
              note: this.clientForm.globalNote.trim()
            };

            // 儲存至資料庫與全域狀態
            await VegeBentoDB.saveOrder(newOrder);

            this.orders.unshift(newOrder);
            this.userHistory.unshift(newOrder);
            this.userHistory = this.cleanupUserHistory(this.userHistory);

            this.showToast(
              wasEditing ? '訂單已成功更新！' : '訂單發送成功！',
              'success'
            );

            // 表單初始化重置
            this.clientForm.unit = '';
            this.clientForm.globalNote = '';
            this.clientForm.singleBento.quantity = 1;
            this.clientForm.customBentos = [{ name: '同仁 1', price: '80', otherPrice: '', vegType: '全素', riceType: '', rice: '正常', mainDish: '', dislikes: [], otherDislike: '' }];
            this.autoSelectFirstAvailableDish();
          } catch (error) {
            console.error(error);
            this.showToast('送出訂單時發生錯誤，請稍後再試。', 'danger');
          } finally {
            this.isSubmitting = false;
          }
        },

        showToast(msg, type = 'success') {
          this.toast.message = msg;
          this.toast.type = type;
          this.toast.show = true;
          setTimeout(() => { this.toast.show = false; }, 3500);
        }
      }
    }
  </script>
